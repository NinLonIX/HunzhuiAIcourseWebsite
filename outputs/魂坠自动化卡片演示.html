<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>魂坠自动化控制台 · 卡片演示</title>
  <style>
    :root{
      --bg:#070b12; --bg2:#0d131d; --panel:#111923; --panel2:#182231;
      --line:#2d4058; --muted:#8fa0b5; --text:#ecf3ff; --blue:#72b7ff;
      --green:#42e1a1; --purple:#c89bff; --gold:#f5c86a; --red:#ff7f8f;
      --shadow:0 28px 70px rgba(0,0,0,.42); --ease:cubic-bezier(.22,.74,.25,1);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:radial-gradient(circle at 70% 10%,#152338 0,#080c13 44%,#05070b 100%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif}
    body{min-height:100vh;overflow-x:hidden}
    button{font:inherit;color:inherit}
    .app-shell{min-height:100vh;padding:18px 24px 22px;display:flex;flex-direction:column;gap:14px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;border:1px solid #26384f;background:rgba(11,17,26,.78);box-shadow:0 12px 30px rgba(0,0,0,.24);padding:14px 16px;border-radius:14px;position:relative;z-index:5}
    .brand{display:flex;align-items:center;gap:14px;min-width:270px}
    .brand-mark{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#2b5d8e,#1b2b41);border:1px solid #4c759b;color:var(--green);font-size:20px;box-shadow:0 0 0 4px rgba(66,225,161,.08)}
    .brand-kicker{font:11px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
    .brand h1{margin:2px 0 0;font-size:20px;letter-spacing:.04em}
    .index-nav{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
    .index-btn{border:1px solid #2c405a;background:#101926;color:#9eb2c9;border-radius:9px;padding:8px 10px;min-width:54px;cursor:pointer;transition:all .25s var(--ease);font-size:12px}
    .index-btn:hover,.index-btn:focus-visible{border-color:#76aee2;color:#fff;transform:translateY(-1px);outline:none}
    .index-btn.is-active{background:linear-gradient(180deg,#2c4c6d,#1d324a);color:#fff;border-color:#75b8ff;box-shadow:0 0 0 3px rgba(114,183,255,.13)}
    .index-btn .n{display:block;color:var(--green);font:10px ui-monospace,SFMono-Regular,Consolas,monospace;margin-bottom:3px}
    .workspace{flex:1;min-height:0;display:grid;grid-template-columns:minmax(255px,310px) 1fr;gap:16px}
    .story-panel{border:1px solid #2b405a;border-radius:16px;background:linear-gradient(180deg,rgba(16,27,41,.94),rgba(9,14,22,.96));padding:24px 22px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow);position:relative;overflow:hidden}
    .story-panel:after{content:"";position:absolute;inset:auto -40% -38% 15%;height:230px;background:radial-gradient(circle,rgba(66,225,161,.15),transparent 68%);pointer-events:none}
    .eyebrow{color:var(--green);font:11px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.16em;text-transform:uppercase}
    .story-title-row{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:12px;align-items:start;margin:12px 0 10px}
    .story-panel h2{font-size:32px;line-height:1.13;margin:0;letter-spacing:-.02em}
    .story-panel h2 span{color:var(--blue)}
    .preview-trigger{display:block;border:1px solid #35516e;border-radius:10px;background:#0d1723;padding:5px;cursor:pointer;text-align:left;transition:transform .25s var(--ease),border-color .25s ease,box-shadow .25s ease}
    .preview-trigger:hover,.preview-trigger:focus-visible{border-color:var(--blue);box-shadow:0 0 0 3px rgba(114,183,255,.14);transform:translateY(-2px);outline:none}
    .preview-trigger img{display:block;width:100%;height:58px;object-fit:cover;object-position:center;border-radius:6px;border:1px solid #253b54;background:#07101a}
    .preview-trigger span{display:block;margin-top:5px;color:#86a5c6;font:9px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.06em;text-transform:uppercase;text-align:center}
    .story-summary{color:#c7d3e2;line-height:1.75;font-size:14px;min-height:112px;transition:opacity .18s ease,transform .18s ease}
    .story-summary.fade{opacity:0;transform:translateY(6px)}
    .story-divider{height:1px;background:linear-gradient(90deg,#314863,transparent);margin:17px 0}
    .story-list{list-style:none;margin:0;padding:0;display:grid;gap:11px}
    .story-list li{display:flex;gap:9px;align-items:flex-start;color:#b7c6d7;font-size:13px;line-height:1.45}
    .story-list li:before{content:"✓";display:grid;place-items:center;width:18px;height:18px;flex:0 0 18px;border-radius:6px;background:rgba(66,225,161,.14);border:1px solid rgba(66,225,161,.42);color:var(--green);font-size:11px;margin-top:1px}
    .story-footer{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-top:20px;position:relative;z-index:1}
    .progress{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted)}
    .progress strong{color:var(--text);font-size:20px}
    .kbd-hint{color:#71859d;font-size:11px;line-height:1.55;text-align:right}
    .stage{min-height:620px;position:relative;border:1px solid #24374f;border-radius:18px;background:linear-gradient(180deg,rgba(15,24,37,.82),rgba(7,11,17,.92));box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
    .stage-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #24374f;color:#8da4bd;font-size:12px;position:relative;z-index:3}
    .stage-head .live{display:flex;align-items:center;gap:8px;color:#a9c2dc}
    .live i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 14px rgba(66,225,161,.8);animation:pulse 2s infinite}
    @keyframes pulse{50%{opacity:.45;transform:scale(.78)}}
    .stage-glow{position:absolute;inset:22% 5% 4%;background:radial-gradient(ellipse at center,rgba(86,151,214,.16),transparent 68%);pointer-events:none}
    .theater{position:relative;flex:1;min-height:0;perspective:1400px;overflow:hidden}
    .track{position:absolute;inset:0;transform-style:preserve-3d}
    .theater-card{position:absolute;top:50%;left:50%;width:min(430px,48vw);height:500px;transform-style:preserve-3d;transform-origin:center center;transition:transform .62s var(--ease),opacity .5s ease,filter .5s ease;cursor:pointer;user-select:none}
    .card-surface{height:100%;border:1px solid #2d435c;border-radius:18px;background:linear-gradient(160deg,rgba(25,38,55,.96),rgba(10,16,24,.98));box-shadow:0 30px 60px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.04);padding:20px;display:flex;flex-direction:column;overflow:hidden;position:relative}
    .theater-card.is-active .card-surface{border-color:var(--tone);box-shadow:0 34px 80px rgba(0,0,0,.56),0 0 0 1px color-mix(in srgb,var(--tone) 55%,transparent),0 0 42px color-mix(in srgb,var(--tone) 20%,transparent)}
    .card-surface:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--tone);opacity:.9}
    .card-meta{display:flex;align-items:center;justify-content:space-between;color:#8da3bc;font:11px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase}
    .card-tag{border:1px solid color-mix(in srgb,var(--tone) 60%,#2b3a4d);padding:5px 7px;border-radius:7px;color:var(--tone);background:color-mix(in srgb,var(--tone) 10%,transparent)}
    .card-surface h3{font-size:27px;letter-spacing:-.02em;margin:17px 0 4px}
    .card-subtitle{color:var(--tone);font:12px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.08em}
    .mini{margin-top:18px;flex:1;min-height:0;border:1px solid #2a3c52;background:#0b1119;border-radius:12px;padding:12px;overflow:hidden;position:relative}
    .mini-title{font-size:11px;color:#9cb2ca;margin-bottom:9px;display:flex;justify-content:space-between;gap:8px}
    .mini-row{height:8px;border-radius:4px;background:#24364c;margin:7px 0;opacity:.92}
    .mini-row.green{background:linear-gradient(90deg,rgba(66,225,161,.85),rgba(66,225,161,.2))}
    .mini-row.blue{background:linear-gradient(90deg,rgba(114,183,255,.85),rgba(114,183,255,.2))}
    .mini-row.purple{background:linear-gradient(90deg,rgba(200,155,255,.85),rgba(200,155,255,.2))}
    .mini-row.gold{background:linear-gradient(90deg,rgba(245,200,106,.9),rgba(245,200,106,.16))}
    .mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}
    .mini-stat{border:1px solid #263a53;border-radius:7px;padding:8px 7px;background:#101a27}.mini-stat b{display:block;font-size:16px;color:#e9f2ff}.mini-stat span{font-size:9px;color:#7f95ac}
    .mini-table{display:grid;gap:5px}.mini-table div{display:grid;grid-template-columns:1.3fr .7fr .7fr;gap:5px;align-items:center}.mini-table i{height:7px;border-radius:3px;background:#293b51}.mini-table b{height:7px;border-radius:3px;background:var(--tone);opacity:.8}
    .status-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(66,225,161,.42);background:rgba(66,225,161,.1);color:var(--green);border-radius:999px;padding:4px 8px;font-size:10px}
    .status-chip:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
    .map-mini{height:100%;display:grid;place-items:center}.map-lines{position:absolute;inset:0}.map-line{position:absolute;height:2px;background:#587494;transform-origin:left center;opacity:.8}.map-node{position:absolute;width:55px;height:30px;border:1px solid #54799f;border-radius:7px;background:#1a2b40;display:grid;place-items:center;font-size:9px;color:#dce9f6}.map-node.active{border-color:var(--green);background:#163b37;color:#eafff7;box-shadow:0 0 18px rgba(66,225,161,.25)}
    .inventory{display:grid;gap:6px}.inv-row{display:grid;grid-template-columns:16px 1fr auto;align-items:center;gap:7px;padding:6px;border:1px solid #24364b;border-radius:7px;color:#b8c9dc;font-size:10px}.inv-dot{width:10px;height:10px;border-radius:3px;background:var(--tone);box-shadow:0 0 8px color-mix(in srgb,var(--tone) 55%,transparent)}.inv-row b{color:#eff7ff;font-size:11px}
    .loot{display:grid;grid-template-columns:1fr 48px 34px;gap:5px;font-size:10px}.loot span,.loot b{padding:7px;border-bottom:1px solid #24364b}.loot b{color:var(--purple);text-align:center}
    .filter-bar{display:flex;gap:6px;margin-bottom:10px}.filter{height:22px;border:1px solid #3c5470;background:#182639;border-radius:5px;flex:1}.filter.short{flex:.6}.recycle-table{display:grid;gap:5px}.recycle-table div{display:grid;grid-template-columns:16px 1.3fr .65fr .65fr;gap:6px;align-items:center;padding:6px;border:1px solid #24364b;border-radius:6px;font-size:10px;color:#afc1d5}.tick{width:12px;height:12px;border-radius:3px;border:1px solid #6c8caf;background:#22364d;display:grid;place-items:center;color:var(--green);font-size:9px}
    .socket-board{display:grid;grid-template-columns:1fr 1fr;gap:9px;height:100%}.socket-col{border:1px solid #293d54;border-radius:8px;padding:9px}.socket-col h4{font-size:10px;color:#a4b8cd;margin:0 0 9px}.socket-line{display:flex;gap:5px;flex-wrap:wrap}.socket{width:25px;height:25px;border-radius:50%;border:2px solid #e6758a;background:rgba(230,117,138,.1)}.socket.good{border-color:var(--green);background:rgba(66,225,161,.16)}
    .card-bottom{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-top:14px}.card-description{font-size:12px;line-height:1.5;color:#aabbd0;max-width:70%}.highlight{display:inline-block;position:relative;color:#f4f8ff;font:12px ui-monospace,SFMono-Regular,Consolas,monospace;padding:2px 5px;z-index:0}.highlight:before{content:"";position:absolute;z-index:-1;left:0;right:0;bottom:1px;height:7px;border-radius:3px;background:color-mix(in srgb,var(--tone) 52%,transparent);transform:scaleX(0);transform-origin:left;transition:transform .6s var(--ease) .18s}.is-active .highlight:before{transform:scaleX(1)}
    .side-index{font:11px ui-monospace,SFMono-Regular,Consolas,monospace;color:#8296ad}
    .stage-foot{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-top:1px solid #24374f;color:#8298b0;font-size:11px;position:relative;z-index:2}.stage-foot strong{color:#c9d8e8;font-weight:500}.stage-foot .key{border:1px solid #2f4661;background:#101a28;border-radius:6px;padding:4px 7px;color:#a9bed3;margin:0 2px}
    .image-lightbox{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:24px;background:rgba(3,7,12,.84);backdrop-filter:blur(12px);opacity:0;pointer-events:none;transition:opacity .25s ease}
    .image-lightbox.is-open{opacity:1;pointer-events:auto}
    .lightbox-card{width:min(1100px,92vw);max-height:92vh;border:1px solid #45698d;border-radius:18px;background:#0b131e;box-shadow:0 36px 100px rgba(0,0,0,.65);padding:12px;position:relative;transform:translateY(10px) scale(.98);transition:transform .25s var(--ease)}
    .image-lightbox.is-open .lightbox-card{transform:translateY(0) scale(1)}
    .lightbox-card img{display:block;width:100%;max-height:calc(92vh - 76px);object-fit:contain;border-radius:10px;background:#050a10}
    .lightbox-label{display:flex;justify-content:space-between;align-items:center;padding:9px 3px 2px;color:#a8bed4;font-size:12px}.lightbox-label strong{color:#eff6ff;font-size:15px}
    .lightbox-close{position:absolute;right:18px;top:18px;width:32px;height:32px;border:1px solid #557493;border-radius:50%;background:rgba(7,13,21,.85);color:#fff;font-size:18px;line-height:1;cursor:pointer}.lightbox-close:hover,.lightbox-close:focus-visible{border-color:#fff;outline:none}
    @media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
    @media (max-width:1100px){.app-shell{padding:14px}.workspace{grid-template-columns:250px 1fr}.theater-card{width:min(390px,50vw)}}
    @media (max-width:900px){.app-shell{padding:10px;gap:10px}.topbar{align-items:flex-start;flex-direction:column}.brand{min-width:0}.index-nav{justify-content:flex-start}.workspace{display:flex;flex-direction:column}.story-panel{min-height:260px;padding:18px}.story-summary{min-height:0}.story-footer{margin-top:14px}.stage{min-height:580px}.theater-card{width:min(420px,78vw);height:465px}.stage-head{padding:12px 14px}.stage-foot{padding:10px 14px}.kbd-hint{display:none}}
    @media (max-width:560px){.brand h1{font-size:17px}.index-btn{min-width:45px;padding:7px 8px;font-size:11px}.story-title-row{grid-template-columns:minmax(0,1fr) 82px}.story-panel h2{font-size:26px}.preview-trigger img{height:52px}.stage{min-height:520px}.theater-card{width:calc(100vw - 48px);height:425px}.card-surface{padding:16px}.card-surface h3{font-size:23px}.mini{margin-top:12px}.card-description{font-size:11px}}
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">魂</div>
        <div><div class="brand-kicker">SOULFALL · AUTOMATION CONSOLE</div><h1>魂坠自动化控制台</h1></div>
      </div>
      <nav class="index-nav" aria-label="功能索引" id="indexNav"></nav>
    </header>

    <main class="workspace">
      <aside class="story-panel" aria-live="polite">
        <div>
          <div class="eyebrow" id="storyEyebrow">01 / OVERVIEW</div>
          <div class="story-title-row">
            <h2 id="storyTitle">主界面<br><span>运行总览</span></h2>
            <button class="preview-trigger" id="previewTrigger" type="button" aria-label="打开主界面的实际图片预览"><img id="previewThumb" src="assets/01-主界面.png" alt="主界面实际图片预览"><span>实际图片预览</span></button>
          </div>
          <div class="story-divider"></div>
          <p class="story-summary" id="storySummary"></p>
          <ul class="story-list" id="storyList"></ul>
        </div>
        <div class="story-footer">
          <div class="progress"><strong id="storyProgress">01</strong><br><span>/ 08 MODULES</span></div>
          <div class="kbd-hint">← → 切换<br>滚轮 / 点击跳转</div>
        </div>
      </aside>

      <section class="stage" aria-label="3D 功能卡片舞台">
        <div class="stage-head"><span>功能地图 · 8 个模块</span><span class="live"><i></i> LOCAL PREVIEW / READ ONLY</span></div>
        <div class="stage-glow"></div>
        <div class="theater" id="theater"><div class="track" id="track"></div></div>
        <div class="stage-foot"><span>当前焦点：<strong id="stageFocus">主界面</strong></span><span><span class="key">←</span><span class="key">→</span> 键盘导航 · <span class="key">Wheel</span> 翻页</span></div>
      </section>
    </main>
  </div>

  <div class="image-lightbox" id="imageLightbox" role="dialog" aria-modal="true" aria-labelledby="lightboxTitle">
    <div class="lightbox-card">
      <button class="lightbox-close" id="lightboxClose" type="button" aria-label="关闭图片预览">×</button>
      <img id="lightboxImage" src="assets/01-主界面.png" alt="主界面实际图片">
      <div class="lightbox-label"><strong id="lightboxTitle">主界面 · 实际图片</strong><span>点击外部或按 Esc 关闭</span></div>
    </div>
  </div>

  <script>
    const cards = [
      {id:'main', index:'01', tone:'#42e1a1', label:'OVERVIEW', title:'主界面', subtitle:'运行总览 / 精确日志', image:'assets/01-主界面.png', summary:'把连接、挂机策略、房间预测和运行日志放在同一屏，方便快速判断当前是否稳定运行。', bullets:['保垒只读连接状态清晰可见','策略、章节与门禁条件同步显示','逐行日志保留重连与恢复过程'], highlight:'已连接 · 保垒只读', mini:'main'},
      {id:'detail', index:'02', tone:'#72b7ff', label:'AUTOMATION', title:'自动化详情', subtitle:'状态面板 / 配置入口', image:'assets/02-自动化详情.png', summary:'用一段简明状态链说明自动化目前停在哪个阶段，启动、入口和配置是否准备就绪一目了然。', bullets:['自动化开关与当前策略同屏','阶段、回合和启动状态可追踪','入口 mainUIPanel 与配置项可对照'], highlight:'启动：等待', mini:'detail'},
      {id:'stats', index:'03', tone:'#f5c86a', label:'STATISTICS', title:'挂机统计', subtitle:'局局收录 / 稳定记录', image:'assets/03-挂机统计.png', summary:'每局结束自动落库，既能看策略汇总，也能下钻到单局的时间、宝石、进度和 gameGuid。', bullets:['总时长、胜率与策略重开集中汇总','逐局记录保留结算时间与结束原因','统计数据方便复盘长期稳定性'], highlight:'4841 胜 · 559 负 · 89.6%', mini:'stats'},
      {id:'map', index:'04', tone:'#c89bff', label:'MAP VIEW', title:'完整地图', subtitle:'终端实时查看对局策略详情', image:'assets/04-完整地图.png', summary:'把游戏内的分支路线展开成可读地图，实时标记当前位置、自动路线和关键目标。', bullets:['节点与分支顺序完整展示','绿色边框标记当前位置','蓝色路径呈现当前自动路线'], highlight:'起点 → 战斗 → 深入', mini:'map'},
      {id:'gems', index:'05', tone:'#72b7ff', label:'GEM FORGE', title:'宝石合成', subtitle:'稳定高效管理宝石', image:'assets/05-宝石合成.png', summary:'按等级统一管理投入、保留数和可消耗数量，批量合成时减少重复点击，同时保留统计依据。', bullets:['Lv.2—Lv.6 参与等级可勾选','每类宝石独立设置保留数','累计成功率与产出分布可复盘'], highlight:'选择等级 · 设置保留数 · 批次', mini:'gems'},
      {id:'search', index:'06', tone:'#c89bff', label:'TALISMAN SEARCH', title:'护符探寻', subtitle:'自动探寻 / 清晰记录', image:'assets/06-护符探寻.png', summary:'自动完成重复探寻，把抽取消耗、剩余材料和获得护符按批次收录，减少枯燥操作。', bullets:['可先预览可抽次数与预计消耗','获得清单按职业、品质、数量记录','支持跳过卡动画与最低余额保护'], highlight:'预览：10 连×98 → 单抽×5', mini:'search'},
      {id:'recycle', index:'07', tone:'#ff7f8f', label:'TALISMAN RECYCLE', title:'护符分解', subtitle:'批量分解 / 多重保险', image:'assets/07-护符分解.png', summary:'先筛选，再锁定，最后批量确认可分解项；程序把“不会误拆”变成可见的操作步骤。', bullets:['职业与品质筛选先收窄范围','橙色护符默认保留','预计返还在执行前可核对'], highlight:'保留橙色 · 锁定 · 批量确认', mini:'recycle'},
      {id:'drill', index:'08', tone:'#42e1a1', label:'SOCKET PLANNER', title:'护符打孔', subtitle:'最优算法 / 自选孔形', image:'assets/08-护符打孔.png', summary:'材料准备好后，程序比较当前孔位与候选孔形，给出更稳的装配建议，减少试错。', bullets:['当前护符与材料余额实时对照','绿色表示已匹配的宝石槽位','推荐结果可在执行前预览'], highlight:'最优放置 · 新孔形 · 预览', mini:'drill'}
    ];

    const track = document.getElementById('track');
    const indexNav = document.getElementById('indexNav');
    let active = 0;
    let wheelLock = false;

    function renderMini(card){
      if(card.mini==='main') return `<div class="mini-title"><span>连接：<b style="color:#42e1a1">已连接 · 保垒只读</b></span><span>ROOM / 预测</span></div><div class="status-chip">当前挂机策略：挂机策略1——翻倍章节</div><div class="mini-row green" style="width:83%"></div><div class="mini-row" style="width:62%"></div><div class="mini-row" style="width:73%"></div><div class="mini-row" style="width:55%"></div><div class="mini-row blue" style="width:90%"></div><div class="mini-row" style="width:68%"></div><div class="mini-row gold" style="width:44%"></div>`;
      if(card.mini==='detail') return `<div class="mini-title"><span>详细状态</span><span style="color:#72b7ff">READY</span></div><div class="mini-grid"><div class="mini-stat"><b>已连接</b><span>连接</span></div><div class="mini-stat"><b>已暂停</b><span>自动化</span></div><div class="mini-stat"><b>1</b><span>回合</span></div></div><div class="mini-row blue" style="width:87%"></div><div class="mini-row" style="width:72%"></div><div class="mini-row purple" style="width:63%"></div><div class="mini-row" style="width:81%"></div><div class="mini-title" style="margin-top:15px"><span>入口</span><b style="color:#dcecff">mainUIPanel</b></div>`;
      if(card.mini==='stats') return `<div class="mini-title"><span>策略汇总</span><span style="color:#f5c86a">已收录</span></div><div class="mini-grid"><div class="mini-stat"><b>4841</b><span>胜利</span></div><div class="mini-stat"><b>559</b><span>失败</span></div><div class="mini-stat"><b>89.6%</b><span>胜率</span></div></div><div class="mini-table"><div><i></i><b style="width:85%"></b><i></i></div><div><i></i><b style="width:69%"></b><i></i></div><div><i></i><b style="width:53%"></b><i></i></div><div><i></i><b style="width:76%"></b><i></i></div></div><div class="mini-title" style="margin-top:12px"><span>逐局明细</span><span>gameGuid · stage 6 / 36</span></div>`;
      if(card.mini==='map') return `<div class="mini-title"><span>现有单人局 · 完整路线</span><span style="color:#c89bff">13 节点</span></div><div class="map-mini"><div class="map-lines"><span class="map-line" style="width:85px;left:24%;top:53%;transform:rotate(-24deg)"></span><span class="map-line" style="width:85px;left:24%;top:53%;transform:rotate(23deg)"></span><span class="map-line" style="width:92px;left:48%;top:40%;transform:rotate(27deg)"></span><span class="map-line" style="width:92px;left:48%;top:62%;transform:rotate(-21deg)"></span><span class="map-line" style="width:95px;left:68%;top:51%;transform:rotate(0deg)"></span></div><div class="map-node active" style="left:10%;top:47%">起点</div><div class="map-node" style="left:35%;top:32%">战斗</div><div class="map-node" style="left:35%;top:61%">护符</div><div class="map-node" style="left:59%;top:48%">游艺</div><div class="map-node" style="left:82%;top:47%">深入</div></div>`;
      if(card.mini==='gems') return `<div class="mini-title"><span>未镶嵌宝石库存</span><span style="color:#72b7ff">批次 / 合成</span></div><div class="inventory"><div class="inv-row"><i class="inv-dot"></i><span>迅疾 · 紫晶</span><b>4 / 10</b></div><div class="inv-row"><i class="inv-dot" style="background:#f5c86a"></i><span>别除 · 珍珠</span><b>9 / 10</b></div><div class="inv-row"><i class="inv-dot" style="background:#c89bff"></i><span>觉醒 · 翡翠</span><b>6 / 10</b></div><div class="inv-row"><i class="inv-dot" style="background:#ff7f8f"></i><span>侵袭 · 红玉</span><b>1 / 0</b></div></div><div class="mini-title" style="margin-top:10px"><span>累计实际成功率</span><span style="color:#42e1a1">Lv.6 · 30.7%</span></div>`;
      if(card.mini==='search') return `<div class="mini-title"><span>本批已获得护符</span><span style="color:#c89bff">133 件</span></div><div class="loot"><span style="color:#e6f0ff">偷袭手套</span><b>舞者</b><span>1</span><span style="color:#e6f0ff">冲锋纹印</span><b>战士</b><span>1</span><span style="color:#e6f0ff">凝结核心</span><b>法师</b><span>2</span><span style="color:#e6f0ff">风纹臂铠</span><b>舞者</b><span>1</span></div>`;
      if(card.mini==='recycle') return `<div class="mini-title"><span>护符库存</span><span style="color:#ff7f8f">批次：空闲</span></div><div class="filter-bar"><span class="filter"></span><span class="filter short"></span><span class="filter short"></span></div><div class="recycle-table"><div><i class="tick">✓</i><span>破阵符 · 紫色</span><span>总数 5</span><span>可分解 0</span></div><div><i class="tick">✓</i><span>风纹臂铠 · 紫色</span><span>总数 1</span><span>锁定</span></div><div><i class="tick"></i><span>凝结核心 · 紫色</span><span>总数 2</span><span>锁定</span></div></div>`;
      return `<div class="mini-title"><span>孔位装箱与推荐</span><span style="color:#42e1a1">材料充足</span></div><div class="socket-board"><div class="socket-col"><h4>当前孔形（3 孔）</h4><div class="socket-line"><i class="socket"></i><i class="socket"></i><i class="socket"></i><i class="socket"></i><i class="socket"></i><i class="socket"></i></div></div><div class="socket-col"><h4>新孔形（0 孔）</h4><div class="socket-line"><i class="socket good"></i><i class="socket good"></i><i class="socket good"></i></div></div></div>`;
    }

    function renderCards(){
      track.innerHTML = cards.map((card,i)=>`<article class="theater-card" data-index="${i}" style="--tone:${card.tone}" tabindex="0" aria-label="${card.title}"><div class="card-surface"><div class="card-meta"><span>${card.index} / 08</span><span class="card-tag">${card.label}</span></div><h3>${card.title}</h3><div class="card-subtitle">${card.subtitle}</div><div class="mini">${renderMini(card)}</div><div class="card-bottom"><div class="card-description">${card.summary}</div><div class="side-index">${card.index}</div></div><div class="highlight">${card.highlight}</div></div></article>`).join('');
      [...track.children].forEach((el)=>{el.addEventListener('click',()=>setActive(Number(el.dataset.index)));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setActive(Number(el.dataset.index))}})});
    }

    function renderIndex(){indexNav.innerHTML=cards.map((c,i)=>`<button class="index-btn" data-index="${i}" aria-label="跳转到${c.title}"><span class="n">${c.index}</span>${c.title}</button>`).join('');[...indexNav.children].forEach(btn=>btn.addEventListener('click',()=>setActive(Number(btn.dataset.index))))}

    function updateStory(card){
      const panel=document.querySelector('.story-panel');panel.classList.add('fade');
      setTimeout(()=>{document.getElementById('storyEyebrow').textContent=`${card.index} / ${card.label}`;document.getElementById('storyTitle').innerHTML=`${card.title}<br><span>${card.subtitle.split(' / ')[0]}</span>`;document.getElementById('storySummary').textContent=card.summary;document.getElementById('storyList').innerHTML=card.bullets.map(b=>`<li>${b}</li>`).join('');document.getElementById('storyProgress').textContent=card.index;document.getElementById('stageFocus').textContent=card.title;const thumb=document.getElementById('previewThumb');thumb.src=card.image;thumb.alt=`${card.title}实际图片预览`;document.getElementById('previewTrigger').setAttribute('aria-label',`打开${card.title}的实际图片预览`);panel.classList.remove('fade')},120);
    }

    const previewTrigger=document.getElementById('previewTrigger');
    const lightbox=document.getElementById('imageLightbox');
    const lightboxImage=document.getElementById('lightboxImage');
    const lightboxTitle=document.getElementById('lightboxTitle');
    function openPreview(){const card=cards[active];lightboxImage.src=card.image;lightboxImage.alt=`${card.title}实际图片`;lightboxTitle.textContent=`${card.title} · 实际图片`;lightbox.classList.add('is-open');document.getElementById('lightboxClose').focus()}
    function closePreview(){lightbox.classList.remove('is-open');previewTrigger.focus()}
    previewTrigger.addEventListener('click',openPreview);
    document.getElementById('lightboxClose').addEventListener('click',closePreview);
    lightbox.addEventListener('click',e=>{if(e.target===lightbox)closePreview()});

    function setActive(next,announce=true){
      active=(next+cards.length)%cards.length;
      [...track.children].forEach((el,i)=>{const d=i-active;const abs=Math.abs(d);const x=d*230;const y=abs?16+abs*5:0;const z=100-abs;const rot=d* -28;const scale=abs===0?1:Math.max(.67,1-abs*.12);el.style.transform=`translate(-50%,-50%) translate3d(${x}px,${y}px,${-abs*130}px) rotateY(${rot}deg) scale(${scale})`;el.style.opacity=abs>3?'0':String(Math.max(.16,1-abs*.22));el.style.filter=abs===0?'none':`blur(${Math.min(abs*1.5,4)}px) saturate(${Math.max(.45,1-abs*.14)})`;el.style.zIndex=z;el.classList.toggle('is-active',i===active);el.setAttribute('aria-current',i===active?'true':'false')});[...indexNav.children].forEach((b,i)=>b.classList.toggle('is-active',i===active));updateStory(cards[active]);if(announce) history.replaceState(null,'',`#${cards[active].id}`)}

    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&lightbox.classList.contains('is-open')){e.preventDefault();closePreview();return}if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();setActive(active+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();setActive(active-1)}else if(e.key==='Home'){e.preventDefault();setActive(0)}else if(e.key==='End'){e.preventDefault();setActive(cards.length-1)}});
    document.getElementById('theater').addEventListener('wheel',e=>{if(Math.abs(e.deltaY)<18||wheelLock)return;e.preventDefault();wheelLock=true;setActive(active+(e.deltaY>0?1:-1));setTimeout(()=>wheelLock=false,520)},{passive:false});
    renderCards();renderIndex();
    const initialId=location.hash.slice(1);const initialIndex=cards.findIndex(c=>c.id===initialId);setActive(initialIndex>=0?initialIndex:0,false);
  </script>
</body>
</html>
